<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>交易复盘工作台 · 数据库版</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#080c13;--panel:#0f1621;--panel2:#141d2b;--line:#1d2836;
    --text:#e7eef8;--muted:#7f92a8;--accent:#4c8dff;
    --up:#ff4d5e;--down:#0ec68a;--warn:#f0b429;
  }
  html,body{height:100%}
  body{
    background:
      radial-gradient(1200px 500px at 15% -10%,rgba(76,141,255,.12),transparent 60%),
      radial-gradient(900px 400px at 100% 0%,rgba(14,198,138,.08),transparent 60%),
      var(--bg);
    color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  .app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}

  .sidebar{position:sticky;top:0;height:100vh;padding:18px 12px;background:rgba(11,16,24,.88);
    border-right:1px solid var(--line);display:flex;flex-direction:column;backdrop-filter:blur(8px)}
  .brand{display:flex;align-items:center;gap:10px;padding:2px 6px 14px}
  .logo{width:34px;height:34px;border-radius:10px;flex:none;background:linear-gradient(135deg,#4c8dff,#0ec68a);
    display:grid;place-items:center;font-weight:800;color:#06101d;font-size:15px}
  .brand h1{font-size:13.5px;font-weight:700;letter-spacing:.3px}
  .brand span{display:block;font-size:11px;color:var(--muted);font-weight:400}
  nav{overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:3px;padding-right:2px}
  nav::-webkit-scrollbar{width:5px}
  nav::-webkit-scrollbar-thumb{background:#1f2a3a;border-radius:99px}
  .nav-group{font-size:10.5px;color:#4d5c70;letter-spacing:1px;padding:12px 10px 4px;font-weight:600}
  .nav-btn{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 11px;border-radius:9px;
    border:1px solid transparent;background:transparent;color:var(--muted);font-size:13px;cursor:pointer;
    font-family:inherit;transition:.15s;white-space:nowrap}
  .nav-btn:hover{background:var(--panel2);color:var(--text)}
  .nav-btn.active{background:rgba(76,141,255,.14);border-color:rgba(76,141,255,.34);color:#cfe0ff;font-weight:600}
  .nav-btn .ico{width:16px;text-align:center;font-size:12px;opacity:.85;flex:none}
  .side-foot{font-size:11px;color:#54637a;padding:10px 8px 2px;line-height:1.7;border-top:1px solid var(--line);margin-top:8px}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--down);margin-right:6px;box-shadow:0 0 8px var(--down)}

  main{padding:20px 24px 44px;min-width:0}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .topbar h2{font-size:19px;font-weight:700}
  .topbar p{font-size:12px;color:var(--muted);margin-top:2px}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:11.5px;
    background:rgba(14,198,138,.1);color:#5fe3b6;border:1px solid rgba(14,198,138,.25)}
  .badge.blue{background:rgba(76,141,255,.1);color:#9dc2ff;border-color:rgba(76,141,255,.28)}
  .clock{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted)}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .card+.card{margin-top:14px}
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .card-head h3{font-size:14px;font-weight:650}
  .card-head h3 small{font-weight:400;color:var(--muted);margin-left:8px;font-size:11.5px}

  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;margin-bottom:14px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
  .kpi .k{font-size:11.5px;color:var(--muted)}
  .kpi .v{font-size:21px;font-weight:750;margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
  .kpi .s{font-size:11px;color:#5c6d82;margin-top:2px}

  .tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .chip{padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);
    color:var(--muted);font-size:12px;cursor:pointer;font-family:inherit;transition:.15s}
  .chip:hover{color:var(--text)}
  .chip.active{background:rgba(76,141,255,.16);border-color:rgba(76,141,255,.45);color:#cfe0ff;font-weight:600}
  .search{flex:1;min-width:150px;max-width:280px;padding:7px 12px;border-radius:9px;background:var(--panel2);
    border:1px solid var(--line);color:var(--text);font-size:12.5px;font-family:inherit;outline:none}
  .search:focus{border-color:rgba(76,141,255,.5)}
  .btn{padding:7px 13px;border-radius:9px;border:1px solid rgba(76,141,255,.4);background:rgba(76,141,255,.14);
    color:#cfe0ff;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
  .btn:hover{background:rgba(76,141,255,.24)}
  .btn.ghost{border-color:var(--line);background:var(--panel2);color:var(--muted);font-weight:400}

  .table-wrap{overflow:auto;max-height:70vh;border-radius:12px;border:1px solid var(--line)}
  .lib-table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:880px}
  .lib-table th{position:sticky;top:0;z-index:2;text-align:left;padding:9px 12px;background:#182231;
    color:#a9bcd4;font-weight:600;white-space:nowrap;border-bottom:1px solid var(--line);font-size:11.5px}
  .lib-table td{padding:9px 12px;border-bottom:1px solid rgba(29,40,54,.62);color:#cfdaea;vertical-align:top;
    max-width:340px;word-break:break-word}
  .lib-table td.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  .lib-table tbody tr:hover{background:rgba(76,141,255,.06)}
  .lib-table tbody tr:last-child td{border-bottom:none}
  .lib-table .dim{color:#4d5c70}
  .up{color:var(--up)!important}.down{color:var(--down)!important}.warn{color:var(--warn)}
  .pill{display:inline-block;padding:1px 8px;border-radius:6px;font-size:11px;font-weight:600;white-space:nowrap}
  .pill.buy{background:rgba(255,77,94,.14);color:#ff8b96}
  .pill.cut{background:rgba(14,198,138,.14);color:#57d9ad}
  .pill.hold{background:rgba(240,180,41,.14);color:#f0c65a}
  .pill.watch{background:rgba(76,141,255,.14);color:#9dc2ff}
  .hint{font-size:11.5px;color:#586880;margin-top:10px;line-height:1.7}
  .hint code{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:#9dc2ff}

  .banner{background:linear-gradient(90deg,rgba(76,141,255,.12),rgba(14,198,138,.07));
    border:1px solid rgba(76,141,255,.28);border-radius:12px;padding:13px 16px;margin-bottom:14px}
  .banner .t{font-size:12px;color:var(--muted)}
  .banner .m{font-size:15px;font-weight:700;margin-top:3px;color:#e7eef8}

  .insights{list-style:none;display:flex;flex-direction:column;gap:9px}
  .insights li{font-size:13px;color:#c3d1e2;padding-left:16px;position:relative;line-height:1.7}
  .insights li::before{content:'';position:absolute;left:2px;top:9px;width:6px;height:6px;border-radius:2px;
    background:linear-gradient(135deg,#4c8dff,#0ec68a)}
  .insights b{color:#fff}

  .watch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
  .watch{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 15px}
  .watch .w-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
  .watch .w-name{font-size:15px;font-weight:700}
  .watch .w-price{font-size:15px;font-weight:700;color:#ff8b96;font-variant-numeric:tabular-nums}
  .watch .row{font-size:12.5px;color:#b6c6da;margin-top:5px;line-height:1.65}
  .watch .row span{color:#5c6d82;margin-right:6px}

  .news-item{padding:12px 2px;border-bottom:1px solid rgba(29,40,54,.7);cursor:pointer}
  .news-item:last-child{border-bottom:none}
  .news-meta{display:flex;gap:10px;align-items:center;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
  .tag{padding:1px 8px;border-radius:5px;background:rgba(76,141,255,.12);color:#9dc2ff;font-size:11px}
  .news-title{font-size:13.5px;font-weight:600;margin:5px 0 0}
  .news-sum{font-size:12.5px;color:var(--muted);max-height:0;overflow:hidden;transition:.28s}
  .news-item.open .news-sum{max-height:220px;margin-top:6px}
  .reports{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
  .report{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px}
  .report h4{font-size:13.5px;font-weight:600;margin:6px 0 8px;line-height:1.5}
  .report .r-foot{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
  .src-table{width:100%;border-collapse:collapse;font-size:12.5px}
  .src-table th,.src-table td{text-align:left;padding:8px 10px;border-bottom:1px solid rgba(29,40,54,.6)}
  .src-table th{color:var(--muted);font-weight:500;font-size:11.5px}
  .hidden{display:none!important}

  @media (max-width:900px){
    .app{grid-template-columns:1fr}
    .sidebar{position:sticky;top:0;z-index:30;height:auto;flex-direction:column;padding:8px 10px 6px}
    .brand{padding:0 0 6px}
    .brand span{display:none}
    nav{flex-direction:row;overflow-x:auto;overflow-y:hidden;gap:6px;padding-bottom:4px}
    .nav-group{display:none}
    .nav-btn{width:auto;padding:7px 10px;font-size:12.5px}
    .nav-btn .ico{display:none}
    .side-foot{display:none}
    main{padding:14px 12px 40px}
    .topbar h2{font-size:17px}
    .lib-table{min-width:760px}
  }
</style>
</head>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">Q</div>
      <div><h1>交易复盘工作台</h1><span>CSV 每日更新 · 6 库</span></div>
    </div>
    <nav>
      <div class="nav-group">概览</div>
      <button class="nav-btn active" data-view="overview"><span class="ico">▦</span>总览看板</button>
      <div class="nav-group">每日数据库</div>
      <button class="nav-btn" data-view="market"><span class="ico">▤</span>大盘日志</button>
      <button class="nav-btn" data-view="sector"><span class="ico">◈</span>板块龙头</button>
      <button class="nav-btn" data-view="pre"><span class="ico">◉</span>盘前观测池</button>
      <div class="nav-group">持仓与交易</div>
      <button class="nav-btn" data-view="long"><span class="ico">◫</span>长线操盘局</button>
      <button class="nav-btn" data-view="short"><span class="ico">◧</span>短线操作局</button>
      <button class="nav-btn" data-view="ledger"><span class="ico">▥</span>交易流水库</button>
      <div class="nav-group">资讯</div>
      <button class="nav-btn" data-view="news"><span class="ico">◔</span>新闻资讯</button>
      <button class="nav-btn" data-view="reports"><span class="ico">◕</span>研报中心</button>
    </nav>
    <div class="side-foot"><span class="dot"></span>数据文件已接入<br>替换同名 CSV 即可更新</div>
  </aside>

  <main>
    <div class="topbar">
      <div>
        <h2 id="page-title">总览看板</h2>
        <p id="page-sub">交易统计、纪律复盘与最新盘面</p>
      </div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span class="badge" id="src-badge">数据源：内置</span>
        <span class="clock" id="clock">--:--:--</span>
        <button class="btn ghost" id="reload">重新加载</button>
      </div>
    </div>

    <section id="view-overview"></section>
    <section id="view-market" class="hidden"></section>
    <section id="view-sector" class="hidden"></section>
    <section id="view-pre" class="hidden"></section>
    <section id="view-long" class="hidden"></section>
    <section id="view-short" class="hidden"></section>
    <section id="view-ledger" class="hidden"></section>
    <section id="view-news" class="hidden"></section>
    <section id="view-reports" class="hidden"></section>
  </main>
</div>

  const m = String(s ?? '').replace(/,/g, '').match(/-?\d+(\.\d+)?/);
  return m ? parseFloat(m[0]) : null;
};

/* ================= CSV 解析 ================= */
function parseCSV(text){
  const rows = [];
  let row = [], cell = '', inQuotes = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (inQuotes){
      if (ch === '"'){
        if (text[i + 1] === '"'){ cell += '"'; i++; } else inQuotes = false;
      } else cell += ch;
    } else if (ch === '"' && cell === ''){
      inQuotes = true;
    } else if (ch === ','){
      row.push(cell); cell = '';
    } else if (ch === '\n'){
      row.push(cell); rows.push(row); row = []; cell = '';
    } else if (ch !== '\r'){
      cell += ch;
    }
  }
  row.push(cell);
  rows.push(row);
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}

function toTable(text){
  const rows = parseCSV(text);
  let hi = rows.findIndex(r => r.some(c => String(c).trim() === '日期'));
  if (hi < 0) hi = rows.findIndex(r => r.some(c => String(c).includes('日期')));
  if (hi < 0) hi = 0;
  const headers = rows[hi].map(h => String(h).trim());
  return { headers, rows: rows.slice(hi + 1) };
}

/* ================= 数据加载 ================= */
const store = {};

async function fetchLib(def){
  const cands = [def.cn, def.file, 'data/' + def.cn, 'data/' + def.file];
  for (const p of cands){
    try {
      const res = await fetch(encodeURI(p) + '?v=' + Date.now(), { cache:'no-store' });
      if (!res.ok) continue;
      const txt = await res.text();
      if (!txt || txt.trim().startsWith('<')) continue;
      const t = toTable(txt);
      if (t.rows.length) return { ...t, source:p };
    } catch (e) { /* 继续尝试下一个名字 */ }
  }
  return null;
}

async function loadAll(){
  let csvCount = 0;
  for (const def of LIB_DEFS){
    const got = await fetchLib(def);
    if (got){ store[def.key] = got; csvCount++; }
    else { store[def.key] = { ...toTable(EMBEDDED[def.key]), source:'内置示例' }; }
  }
  const badge = $('#src-badge');
  if (csvCount){
    badge.textContent = `已接入 ${csvCount}/${LIB_DEFS.length} 个 CSV`;
    badge.classList.add('blue');
  } else {
    badge.textContent = '数据源：内置示例';
    badge.classList.remove('blue');
  }
}

/* ================= 表格渲染 ================= */
const isNumCol = h => /价格|成本|盈亏|数量|成交|股|亿|%.*/.test(h + '') && !/逻辑|理由/.test(h);

function opTag(v){
  if (/买入|加仓|建仓|低吸/.test(v)) return 'buy';
  if (/卖出|减仓|清仓|止损|高抛|止盈/.test(v)) return 'cut';
  if (/持有|持仓|过周末/.test(v)) return 'hold';
  return '';
}

function cellHTML(h, v){
  const t = String(v ?? '').trim();
  if (!t || t === '-') return `<td class="${isNumCol(h) ? 'num' : ''} dim">${t === '-' ? '-' : '—'}</td>`;
  if (/动作|操作/.test(h)){
    const tag = opTag(t);
    if (tag) return `<td><span class="pill ${tag}">${esc(t)}</span></td>`;
  }
  let cls = isNumCol(h) ? 'num' : '';
  if (/盈亏|利润/.test(h)){
    const n = toNum(t);
    if (n !== null) cls += n < 0 ? ' down' : ' up';
  }
  if (/按计划/.test(h) && t === '否') cls += ' warn';
  return `<td class="${cls}">${esc(t)}</td>`;
}

function tableHTML(headers, rows){
  const head = `<thead><tr>${headers.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>`;
  const body = rows.map(r => {
    const cells = r.length > headers.length
      ? [...r.slice(0, headers.length - 1), r.slice(headers.length - 1).join('，')]
      : r.slice();
    while (cells.length < headers.length) cells.push('');
    return `<tr>${cells.map((c, i) => cellHTML(headers[i], c)).join('')}</tr>`;
  }).join('');
  return head + `<tbody>${body}</tbody>`;
}

function renderOverview(){
  const L = store.ledger;
  const h = L.headers;
  const iName = h.findIndex(x => x.includes('名称'));
  const iPlan = h.findIndex(x => x.includes('按计划'));
  const iPL = h.findIndex(x => x.includes('盈亏'));
  const iAct = h.findIndex(x => x.includes('操作'));
  const iState = h.findIndex(x => x.includes('状态'));
  const iCode = h.findIndex(x => x.includes('代码'));

  let total = 0, wins = 0, losses = 0, plannedPnl = 0, unplannedPnl = 0;
  let planYes = 0, planNo = 0, closed = 0;
  let biggestLoss = null, biggestWin = null;
  const openSet = new Set();

  L.rows.forEach(r => {
    const pnl = toNum(r[iPL]);
    const isPlan = (r[iPlan] || '').trim();
    if (isPlan === '是') planYes++; else if (isPlan === '否') planNo++;
    if (pnl !== null){
      closed++;
      total += pnl;
      if (pnl > 0){ wins++; plannedPnl += isPlan === '是' ? 0 : 0; }
      if (pnl < 0) losses++;
      if (isPlan === '是') plannedPnl += pnl; else unplannedPnl += pnl;
      if (!biggestLoss || pnl < biggestLoss.pnl) biggestLoss = { pnl, name: r[iName] };
      if (!biggestWin || pnl > biggestWin.pnl) biggestWin = { pnl, name: r[iName] };
    }
    if ((r[iState] || '').includes('持仓中') && r[iCode]) openSet.add(r[iCode]);
  });

  const winRate = (wins + losses) ? (wins / (wins + losses) * 100) : 0;
  const planRate = (planYes + planNo) ? (planYes / (planYes + planNo) * 100) : 0;

        <div class="k">胜率</div>

      </div>
      <div class="kpi">
        <div class="k">当前持仓标的</div>
        <div class="v">${openSet.size}</div>
        <div class="s">来自流水库状态字段</div>

            <div class="r-foot"><span>${esc(r.date)}</span><span>目标价 ${esc(r.target)}</span></div>
          </div>`).join('')}
      </div>
      <p class="hint">可整理为 <code>reports.csv</code>（列：机构,评级,目标价,日期,标题,摘要）实现每日上传更新。</p>
    </div>`;
}
const pillFor = r => r === '买入' ? 'buy' : r === '增持' ? 'hold' : 'watch';

/* ================= 视图切换 ================= */
const TITLES = {
  overview:['总览看板','交易统计、纪律复盘与最新盘面'],
  market:['大盘日志','两市成交额、涨跌家数、资金流向与盘面定性'],
  sector:['板块龙头','每日板块排名与行业龙头表现'],
  pre:['盘前观测池','候选标的、核心锚点与触发动作'],
  long:['长线操盘局','轨道 A/B 持仓、止损与操作记录'],
  short:['短线操作局','短线仓、时间纪律与双止盈位'],
  ledger:['交易流水库','逐笔成交、盈亏与是否按计划'],
  news:['新闻资讯','每日信息面跟踪'],
  reports:['研报中心','机构评级与目标价汇总']
};
const VIEWS = Object.keys(TITLES);

function switchView(v){
  VIEWS.forEach(k => $('#view-' + k).classList.toggle('hidden', k !== v));
  $$('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  $('#page-title').textContent = TITLES[v][0];
  $('#page-sub').textContent = TITLES[v][1];
  window.scrollTo({ top:0, behavior:'smooth' });
}
$$('.nav-btn').forEach(b => b.addEventListener('click', () => switchView(b.dataset.view)));

/* ================= 时钟 & 刷新 ================= */
function tick(){
  const d = new Date(), p = n => String(n).padStart(2, '0');
  $('#clock').textContent = `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

async function renderAll(){
  await loadAll();
  LIB_DEFS.forEach(renderLibView);
  renderOverview();
  renderNews();
  renderReports();
}

$('#reload').addEventListener('click', async () => {
  const btn = $('#reload');
  btn.textContent = '加载中…';
  await renderAll();
  btn.textContent = '重新加载';
});

/* ================= 启动 ================= */
(async function init(){
  await renderAll();
  switchView('overview');
  tick();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
